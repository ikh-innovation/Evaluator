services:
  data:
    build:
      context: ./data
    volumes:
      - ./data:/data

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    ports:
      - "18502:8502"
    volumes:
      - ./data:/app/data
    # env_file injects EVERY key from .env (retrieval budgets, timeouts, …);
    # the environment block on top only fail-fasts the required keys.
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required in .env}
      EDF_CHAT_MODEL: ${EDF_CHAT_MODEL:?EDF_CHAT_MODEL is required in .env}
      EDF_EMBED_MODEL: ${EDF_EMBED_MODEL:?EDF_EMBED_MODEL is required in .env}
    depends_on:
      data:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "18501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required in .env}
      EDF_CHAT_MODEL: ${EDF_CHAT_MODEL:?EDF_CHAT_MODEL is required in .env}
      EDF_EMBED_MODEL: ${EDF_EMBED_MODEL:?EDF_EMBED_MODEL is required in .env}
    depends_on:
      data:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required in .env}
      EDF_CHAT_MODEL: ${EDF_CHAT_MODEL:?EDF_CHAT_MODEL is required in .env}
      EDF_EMBED_MODEL: ${EDF_EMBED_MODEL:?EDF_EMBED_MODEL is required in .env}
    depends_on:
      data:
        condition: service_completed_successfully
    restart: unless-stopped
