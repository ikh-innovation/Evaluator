services:
  data:
    build:
      context: ./data
    volumes:
      - ./data:/data

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    ports:
      - "8502:8502"
    volumes:
      - ./data:/app/data
    environment:
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required in .env}
      EDF_CHAT_MODEL: ${EDF_CHAT_MODEL:?EDF_CHAT_MODEL is required in .env}
      EDF_EMBED_MODEL: ${EDF_EMBED_MODEL:?EDF_EMBED_MODEL is required in .env}
    depends_on:
      data:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required in .env}
      EDF_CHAT_MODEL: ${EDF_CHAT_MODEL:?EDF_CHAT_MODEL is required in .env}
      EDF_EMBED_MODEL: ${EDF_EMBED_MODEL:?EDF_EMBED_MODEL is required in .env}
      EDF_NUM_GPU: ${EDF_NUM_GPU:-99}
      EDF_MAIN_GPU: ${EDF_MAIN_GPU:-0}
      EDF_NUM_CTX: ${EDF_NUM_CTX:-8192}
    depends_on:
      data:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required in .env}
      EDF_CHAT_MODEL: ${EDF_CHAT_MODEL:?EDF_CHAT_MODEL is required in .env}
      EDF_EMBED_MODEL: ${EDF_EMBED_MODEL:?EDF_EMBED_MODEL is required in .env}
      EDF_NUM_GPU: ${EDF_NUM_GPU:-99}
      EDF_MAIN_GPU: ${EDF_MAIN_GPU:-0}
      EDF_NUM_CTX: ${EDF_NUM_CTX:-8192}
    depends_on:
      data:
        condition: service_completed_successfully
    restart: unless-stopped
